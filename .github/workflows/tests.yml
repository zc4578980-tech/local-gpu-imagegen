name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-stdlib-suite:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile scripts/mcp_server.py scripts/generate_image.py scripts/check_gpu.py scripts/verify_mcp.py
      - name: Run unit and protocol tests
        run: python -m unittest discover -s tests -v
      - name: Verify stdio MCP contract
        run: python scripts/verify_mcp.py
