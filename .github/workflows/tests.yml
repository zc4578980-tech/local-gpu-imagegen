name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-free-suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "setuptools>=68" "Pillow>=10"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run unit, protocol, packaging, and installed-wheel tests
        run: python -m unittest discover -s tests -v
      - name: Verify stdio MCP contract
        run: python scripts/verify_mcp.py
      - name: Verify named-client configuration contracts
        run: python scripts/verify_client_configs.py
